{% set name = "oddt" %}
{% set version = "0.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 330f510a6563c371627370200fbfb39ed3496662d067d17e09edb5a6025c8ae6

build:
  noarch: python
  number: 1
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - six
    - numpy
    - scipy >=0.17
    - scikit-learn >=0.18
    - scikit-image >=0.12.3
    - joblib >=0.9.4
    - pandas >=0.19.2
    - rdkit >=2017.09
    - openbabel >=2.3.2
  run:
    - python >={{ python_min }}
    - six
    - {{ pin_compatible('numpy') }}
    - scipy >=0.17
    - scikit-learn >=0.18
    - scikit-image >=0.12.3
    - joblib >=0.9.4
    - pandas >=0.19.2
    - rdkit >=2017.09
    - openbabel >=2.3.2

test:
  requires:
    - python {{ python_min }}
  imports:
    - oddt

about:
  home: https://github.com/oddt/oddt
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'Open Drug Discovery Toolkit'
  doc_url: http://oddt.readthedocs.org/en/latest
  dev_url: https://github.com/oddt/oddt

extra:
  recipe-maintainers:
    - hadim
